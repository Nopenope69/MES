services:
  mes-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: smt_mes_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      FUJI_PORT: 30040
      DATABASE_URL: postgres://mes_user:mes_password@postgres:5432/mes_db
    ports:
      - "4000:4000"     # MES HTTP REST API
      - "30040:30040"   # Fuji Nexim Host Communication TCP Socket
    volumes:
      - mes_api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mes-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: smt_mes_web
    restart: unless-stopped
    ports:
      - "3000:80"       # Cleanroom Operator HUD & Station Touchscreen UI
    depends_on:
      - mes-api
    networks:
      - mes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: smt_mes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mes_user
      POSTGRES_PASSWORD: mes_password
      POSTGRES_DB: mes_db
    # ports:
    #   - "5432:5432"  # Hardened: Unpublished from host; accessible only within mes_network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mes_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes_user -d mes_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: smt_mes_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mes-web
      - mes-api
    networks:
      - mes_network

  adminer:
    image: adminer:latest
    container_name: smt_mes_adminer
    restart: unless-stopped
    profiles:
      - debug
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - mes_network

volumes:
  pgdata:
  mes_api_data:
  caddy_data:
  caddy_config:

networks:
  mes_network:
    driver: bridge

