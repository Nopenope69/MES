apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smt-mes.fullname" . }}-api
  labels:
    {{- include "smt-mes.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "smt-mes.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smt-mes.apiSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: mes-api
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "smt-mes.fullname" . }}-config
          ports:
            - name: http
              containerPort: {{ .Values.api.service.httpPort }}
              protocol: TCP
            - name: fuji-tcp
              containerPort: {{ .Values.api.service.fujiPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: data-volume
          {{- if .Values.api.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "smt-mes.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
