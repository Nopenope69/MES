name: SMT MES Engine CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: TypeScript Build & Typecheck
        run: npm run build

      - name: Run Vitest Automated Test Suite
        run: npm test

  docker-build-verify:
    name: Docker Multi-Stage Container Builds
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MES API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: smt-mes-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MES Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: smt-mes-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-audit:
    name: Dependency Security & Vulnerability Gate
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Blocking npm audit gate — High/Critical vulnerabilities fail the build.
      # Approved exceptions are evaluated via .audit-exceptions.json.
      # Each exception requires: advisory/CVE, package, rationale, owner, mitigation, expiresAt.
      - name: Blocking npm audit (High/Critical)
        run: |
          npm audit --audit-level=high --json > audit-output.json 2>&1 || true
          node -e "
            const fs = require('fs');
            const auditRaw = fs.readFileSync('audit-output.json', 'utf-8');
            let audit;
            try { audit = JSON.parse(auditRaw); } catch { console.log('npm audit produced no JSON output — PASS'); process.exit(0); }
            const vulns = audit.vulnerabilities || {};
            const exceptions = JSON.parse(fs.readFileSync('.audit-exceptions.json', 'utf-8')).exceptions || [];
            const now = new Date();
            const activeExceptions = exceptions.filter(e => new Date(e.expiresAt) > now).map(e => e.package);
            const blocking = Object.entries(vulns).filter(([pkg, v]) => {
              const sev = (v.severity || '').toLowerCase();
              if (sev !== 'high' && sev !== 'critical') return false;
              return !activeExceptions.includes(pkg);
            });
            if (blocking.length > 0) {
              console.error('BLOCKING vulnerabilities found:');
              blocking.forEach(([pkg, v]) => console.error('  ❌ ' + pkg + ' (' + v.severity + ')'));
              process.exit(1);
            }
            console.log('✅ npm audit gate passed (' + activeExceptions.length + ' active exceptions)');
          "

  secret-scan:
    name: Secret & Credential Leak Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: Static Application Security Testing (SAST)
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run eslint-plugin-security SAST Scan
        run: npx eslint --no-eslintrc --plugin security --rule '{"security/detect-eval-with-expression":"error","security/detect-non-literal-fs-filename":"warn","security/detect-possible-timing-attacks":"warn","security/detect-no-csrf-before-method-override":"error"}' 'apps/api/src/**/*.ts' || true

  mes-doctor:
    name: MES Doctor Deployment Readiness
    needs: [test-and-lint, security-audit]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run MES Doctor Diagnostics
        run: npx tsx scripts/mes-doctor.ts

  release-gate:
    name: Deterministic Release Gate
    needs: [test-and-lint, docker-build-verify, security-audit, secret-scan, sast-scan, mes-doctor]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Release Attestation
        run: |
          npx tsx scripts/mes-doctor.ts
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  RELEASE GATE: ALL CHECKS PASSED"
          echo "  Commit: ${{ github.sha }}"
          echo "  Ref: ${{ github.ref }}"
          echo "  Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "═══════════════════════════════════════════════════════════"
