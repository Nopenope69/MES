name: SMT MES Engine CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: TypeScript Build & Typecheck
        run: npm run build

      - name: Run Vitest Automated Test Suite
        run: npm test

  docker-build-verify:
    name: Docker Multi-Stage Container Builds
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MES API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: smt-mes-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MES Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: smt-mes-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-audit:
    name: Dependency Security & Vulnerability Gate
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Check High/Critical Vulnerabilities
        run: npm audit --audit-level=high || true
